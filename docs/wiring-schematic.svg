<text x='115' y='1518' font-family='Segoe UI,Arial,sans-serif' font-size='23' font-weight='700' fill='#9a3412'>BEFORE CONNECTING THE BUZZER</text>
<text x='115' y='1551' font-family='Segoe UI,Arial,sans-serif' font-size='21' font-weight='400' fill='#0f172a'>Confirm steady and startup current at 3.3 V are within the ESP32 GPIO drive specification.</text>
<text x='115' y='1583' font-family='Segoe UI,Arial,sans-serif' font-size='20' font-weight='400' fill='#0f172a'>No transistor, 1 kohm resistor, or external buzzer supply in this version. Never apply 5 V or battery voltage to GPIO 25.</text>
<text x='100' y='1639' font-family='Segoe UI,Arial,sans-serif' font-size='19' font-weight='400' fill='#475569'>All GND symbols in this panel connect to receiver GND. Firmware still switches GPIO 25 HIGH for a short beep.</text>
<text x='45' y='1709' font-family='Segoe UI,Arial,sans-serif' font-size='24' font-weight='700' fill='#0f172a'>BUILD NOTES</text>
<text x='45' y='1743' font-family='Segoe UI,Arial,sans-serif' font-size='21' font-weight='400' fill='#0f172a'>1. Each LED has its own 330 ohm resistor. LED anode (+) is on the left; cathode (- / flat side) on the right.</text>
<text x='45' y='1777' font-family='Segoe UI,Arial,sans-serif' font-size='21' font-weight='400' fill='#0f172a'>2. Four-leg tactile buttons: use contacts that are open when released and connected when pressed.</text>
<text x='45' y='1811' font-family='Segoe UI,Arial,sans-serif' font-size='21' font-weight='400' fill='#0f172a'>3. GND symbols are joined within each unit. No wired connection is required between table and watch.</text>
<text x='45' y='1844' font-family='Segoe UI,Arial,sans-serif' font-size='20' font-weight='400' fill='#0f172a'>4. GPIO numbers repeat on the two boards. Follow board labels; this is a logical schematic, not a pin-position map.</text>
<text x='45' y='1878' font-family='Segoe UI,Arial,sans-serif' font-size='20' font-weight='400' fill='#0f172a'>Parts: 2 ESP32s, 4 buttons, 3 LEDs, 3 x 330 ohm, SSD1306 OLED, GPIO-compatible active buzzer (verify SFM-27 first).</text>
</svg>
