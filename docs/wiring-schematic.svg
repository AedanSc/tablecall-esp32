<text x='65' y='873' font-family='Segoe UI,Arial,sans-serif' font-size='20' font-weight='400' fill='#0f172a'>Power this board by USB. OLED: GME12864-11-12-13 V3.22, SSD1306 I2C, 128 x 64. Follow pin labels.</text>
